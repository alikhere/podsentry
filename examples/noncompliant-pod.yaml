apiVersion: v1
kind: Pod
metadata:
  name: noncompliant-pod
  namespace: default
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: app
    image: myapp:latest
    ports:
    - containerPort: 80
      hostPort: 80
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      runAsUser: 0
      capabilities:
        add:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_PTRACE
    volumeMounts:
    - name: host-docker
      mountPath: /var/run/docker.sock
  volumes:
  - name: host-docker
    hostPath:
      path: /var/run/docker.sock
