apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  namespace: production
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: init-permissions
    image: busybox:1.36
    command: ["sh", "-c", "chmod 777 /data"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  containers:
  - name: backend
    image: myapp/backend:v2.1.0
    ports:
    - containerPort: 8080
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: data
      mountPath: /data
    - name: tmp
      mountPath: /tmp
  - name: sidecar
    image: myapp/sidecar:v1.3.0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  volumes:
  - name: data
    emptyDir: {}
  - name: tmp
    emptyDir: {}
